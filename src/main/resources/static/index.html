<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <section id="auth">
        <h1>TaskFlow</h1>
        <p class="muted">Simple task management with JWT authentication.</p>

        <div class="tabs">
            <button id="loginTab" class="active">Login</button>
            <button id="registerTab">Register</button>
        </div>

        <form id="loginForm">
            <input id="loginEmail" type="email" placeholder="Email" required>
            <input id="loginPassword" type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <form id="registerForm" class="hidden">
            <input id="registerUsername" placeholder="Username" required minlength="3">
            <input id="registerEmail" type="email" placeholder="Email" required>
            <input id="registerPassword" type="password" placeholder="Password (8+ characters)" required minlength="8">
            <button type="submit">Create account</button>
        </form>

        <p id="authMessage"></p>
    </section>

    <section id="dashboard" class="hidden">
        <div class="topbar">
            <div>
                <h1>Dashboard</h1>
                <p id="welcome" class="muted"></p>
            </div>
            <button id="logoutButton" class="secondary">Logout</button>
        </div>

        <form id="taskForm">
            <input id="taskTitle" placeholder="Task title" required>
            <input id="taskDescription" placeholder="Description" required>
            <input id="taskDueDate" type="date" required>
            <button type="submit">Add Task</button>
        </form>

        <p id="taskMessage"></p>
        <div id="tasks"></div>
    </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
